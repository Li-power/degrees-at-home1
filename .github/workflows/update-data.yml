name: 每月更新台電開放資料

on:
  schedule:
    - cron: '23 2 6 * *'   # 每月 6 日 10:23（台灣時間）
  workflow_dispatch:       # 也可以在 Actions 頁面手動按「Run workflow」

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓資料
        run: python scripts/update_data.py
      - name: 有變化就存回 GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/taipower.json
          git diff --cached --quiet || (git commit -m "自動更新台電開放資料" && git push)
